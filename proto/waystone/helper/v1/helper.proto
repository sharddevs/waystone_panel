syntax = "proto3";

// Protocol between the unprivileged Waystone agent and the root privileged
// helper on the same machine. One Request and one Response per connection.
//
// Everything in a Request is controlled by the agent, which we must assume
// can be compromised. The helper therefore validates every field and never
// accepts paths, user names or unit names: it derives those from the server
// ID itself. Nothing in this file is specific to Linux or systemd.
package waystone.helper.v1;

option go_package = "github.com/sharddevs/waystone_panel/gen/waystone/helper/v1;helperv1";

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_START = 1;
  ACTION_STOP = 2;
  ACTION_STATUS = 3;
  // Create what the server needs from the machine: its own user, its
  // directory and its service definition. Safe to repeat.
  ACTION_PROVISION = 4;
  // Read one small file in the server's directory, as the server's own
  // user. Game-neutral: what the file means is the agent's profile code.
  ACTION_READ_FILE = 5;
  // Replace one small file in the server's directory, as the server's own
  // user, only if it still is what the agent read (see FileSpec).
  ACTION_WRITE_FILE = 6;
}

// What a new server needs. Names and numbers only: the helper turns the
// runtime name into a program path itself, from its own allowlist.
message ProvisionSpec {
  // A runtime name from the helper's allowlist, such as "java25".
  string runtime = 1;
  // Java heap size in MiB, used for both -Xms and -Xmx.
  uint32 heap_mib = 2;
}

message Request {
  // Canonical lowercase UUID of the operation this request belongs to.
  // The helper logs it, so every root action can be traced to an operation.
  string operation_id = 1;
  // Canonical lowercase UUID of the game server.
  string server_id = 2;
  Action action = 3;
  // Required for ACTION_PROVISION and refused for every other action.
  ProvisionSpec provision = 4;
  // Required for ACTION_READ_FILE and ACTION_WRITE_FILE, refused for
  // every other action.
  FileSpec file = 5;
}

// One file directly inside the server's directory.
message FileSpec {
  // A plain file name: 1 to 64 bytes of letters, digits, '.', '_' and '-',
  // starting with a letter or digit. No paths.
  string name = 1;
  // ACTION_WRITE_FILE only: the new content, at most 48 KiB.
  bytes content = 2;
  // ACTION_WRITE_FILE only, exactly one of these two: the file must not
  // exist, or its current content must have this SHA-256 (32 bytes).
  // Otherwise nothing is written and the answer is ERROR_CODE_CHANGED.
  bool expect_absent = 3;
  bytes expect_sha256 = 4;
}

enum ErrorCode {
  // Success.
  ERROR_CODE_UNSPECIFIED = 0;
  // The caller is not the agent.
  ERROR_CODE_PERMISSION_DENIED = 1;
  // The request failed validation.
  ERROR_CODE_INVALID_REQUEST = 2;
  // The server is not known to this machine.
  ERROR_CODE_NOT_FOUND = 3;
  // The action was attempted and failed.
  ERROR_CODE_FAILED = 4;
  // Something the action would create already exists and was not created
  // by Waystone for this server. Nothing was changed.
  ERROR_CODE_CONFLICT = 5;
  // ACTION_WRITE_FILE: the file is no longer what the agent read. Nothing
  // was written; read it again and decide again.
  ERROR_CODE_CHANGED = 6;
}

// Run state as the panel understands it, independent of the runtime.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_STOPPED = 1;
  RUN_STATE_STARTING = 2;
  RUN_STATE_RUNNING = 3;
  RUN_STATE_STOPPING = 4;
  // Stopped because something went wrong (crash, failed start), as opposed
  // to a deliberate stop.
  RUN_STATE_FAILED = 5;
}

message Response {
  ErrorCode error_code = 1;
  // Human-readable detail for logs. Never shown as-is to tenants.
  string error_message = 2;
  // Set only for ACTION_STATUS.
  RunState run_state = 3;
  // The runtime's own description of the state, for diagnostics only.
  string native_state = 4;
  // Set only for ACTION_PROVISION: true if this request changed anything
  // on the machine, false if everything was already in place.
  bool changed = 5;
  // Set only for ACTION_READ_FILE.
  FileResult file = 6;
}

message FileResult {
  // False if the file does not exist; content is then empty.
  bool exists = 1;
  bytes content = 2;
}
