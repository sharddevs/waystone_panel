syntax = "proto3";

// Protocol between a node's agent and the controller. The agent dials out
// and keeps one long-lived stream open. On that stream it says hello once,
// then reports what it observed on its servers.
//
// The controller trusts nothing in these messages about who is talking:
// the node comes from its own configuration, and the peer's uid from the
// kernel. A report only describes observations. Since stage 4c the
// controller also sends commands (start, stop, restart), and the agent
// answers each one with exactly one result.
package waystone.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sharddevs/waystone_panel/gen/waystone/agent/v1;agentv1";

service AgentLinkService {
  // One stream per agent. The first message must be a Hello; after it come
  // Reports, and Progress and Results for the commands the controller
  // sent on this stream.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);

  // An install's settings (6c-2). Only for a server.install operation
  // that is running on the calling node; anything else is not_permitted,
  // the same answer for every case.
  rpc GetInstallSpec(GetInstallSpecRequest) returns (GetInstallSpecResponse);

  // A pinned artifact, in chunks of at most 32 KiB (6c-2). Only during a
  // running install on the calling node, and only a hash in the pinned
  // set. The controller hashes what it sends and ends the stream with
  // artifact_mismatch if its copy is wrong.
  rpc FetchArtifact(FetchArtifactRequest) returns (stream FetchArtifactResponse);
}

message GetInstallSpecRequest {
  string server_id = 1;
  string operation_id = 2;
}

// What an install sets up. The agent checks every field again against
// its own pinned set and limits.
message GetInstallSpecResponse {
  string version = 1;
  // The artifact's SHA-256, 32 bytes, and its size in bytes.
  bytes artifact_sha256 = 2;
  uint64 artifact_size = 3;
  uint32 port = 4;
  uint32 heap_mib = 5;
  string motd = 6;
  uint32 max_players = 7;
}

message FetchArtifactRequest {
  // The running install this fetch belongs to.
  string operation_id = 1;
  // 32 bytes.
  bytes sha256 = 2;
}

message FetchArtifactResponse {
  bytes data = 1;
}

// Enrollment (stage 6a): a new node redeems a one-time token. Only the
// TCP listener serves it, and it is the one call a key that isn't pinned
// yet may make. The key that gets pinned is the one this connection's
// TLS handshake proved, never anything in the request.
service EnrollService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // The token's secret, exactly 32 bytes.
  bytes secret = 1;
}

message EnrollResponse {
  string node_id = 1;
  // The name the admin gave the node when making the token.
  string name = 2;
}

// What the agent sends.
message ConnectRequest {
  oneof msg {
    Hello hello = 1;
    Report report = 2;
    Progress progress = 3;
    Result result = 4;
    LogChunk log_chunk = 5;
  }
}

// What the controller sends: the HelloReply first, then commands.
message ConnectResponse {
  oneof msg {
    HelloReply hello_reply = 1;
    Command command = 2;
    ServerAdded server_added = 3;
    LogRequest log_request = 4;
  }
}

// A read of a server's log (stage 7a). Not a command: it changes
// nothing, so no operation is recorded and decision N doesn't apply. The
// agent answers each with exactly one LogChunk, and has at most 4 out at
// once.
message LogRequest {
  int64 epoch = 1;
  // A fresh UUID per read, echoed in the LogChunk.
  string request_id = 2;
  string server_id = 3;
  // Empty: the newest lines. Otherwise a cursor from an earlier chunk.
  string after_cursor = 4;
  // 1 to 200.
  uint32 limit = 5;
}

// What a LogRequest found, as the helper gave it.
message LogChunk {
  string request_id = 1;
  LogCode code = 2;
  // Only with LOG_CODE_UNSPECIFIED. The same rules as the helper's
  // LogResult: at most limit lines, oldest first, cleaned, 48 KiB of
  // text in all.
  repeated LogLine lines = 3;
  string cursor = 4;
  bool more = 5;
}

message LogLine {
  int64 time_unix_micro = 1;
  uint32 priority = 2;
  string text = 3;
}

enum LogCode {
  // The read worked; lines may still be empty.
  LOG_CODE_UNSPECIFIED = 0;
  // The server isn't in this agent's inventory, or systemd doesn't know
  // its unit: nothing was ever logged.
  LOG_CODE_NO_LOG = 1;
  // The helper couldn't be asked, or failed.
  LOG_CODE_UNAVAILABLE = 2;
}

// A server created after the hello (6c-2). The controller sends it before
// the server's first command, so the agent's inventory and game ports
// grow without a new hello.
message ServerAdded {
  int64 epoch = 1;
  string server_id = 2;
  // 0 when the server has no port configured.
  uint32 game_port = 3;
}

message Hello {
  // Compared against the controller's configured node, never used as an
  // identity on its own.
  string node_id = 1;
  // Must equal the controller's own version (v0.1: upgrade together).
  string agent_version = 2;
  // What this agent can run, e.g. "systemd", "minecraft-java" (6a): at
  // most 8, each 1 to 32 of a-z, 0-9 and '-'.
  repeated string capabilities = 3;
}

message HelloReply {
  // The session's epoch. Every Report must carry it.
  int64 epoch = 1;
  // The servers on this node at the time of the hello.
  repeated string server_ids = 2;
  uint32 report_interval_seconds = 3;
  // The game port to probe for readiness, per server ID (stage 4d-2,
  // D6). Session setup, not a command, so decision N holds. A server
  // without an entry has no port configured: the agent doesn't probe it
  // and reports readiness UNKNOWN, never guessing a default port. Every
  // key must also be in server_ids. A changed port takes effect at the
  // next hello.
  map<string, uint32> game_ports = 4;
}

message Report {
  int64 epoch = 1;
  // Starts at 1 for each session and must always increase.
  int64 seq = 2;
  google.protobuf.Timestamp agent_time = 3;
  repeated ReportEntry entries = 4;
}

message ReportEntry {
  string server_id = 1;
  ProcessState process_state = 2;
  // Diagnostic only, at most 32 bytes. Never drives a decision.
  string native_state = 3;
  Readiness readiness = 4;
}

// Whether the game answers its players (D6). Only the profile's own probe
// decides READY, and only while the process is RUNNING; a process in any
// other state is NOT_READY.
enum Readiness {
  // Refused, like any number this build doesn't know.
  READINESS_UNSPECIFIED = 0;
  READINESS_READY = 1;
  READINESS_NOT_READY = 2;
  // No trustworthy answer: no port configured, or the process state
  // itself is unknown.
  READINESS_UNKNOWN = 3;
  // The profile has no probe by design.
  READINESS_NOT_SUPPORTED = 4;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STOPPED = 1;
  PROCESS_STATE_STARTING = 2;
  PROCESS_STATE_RUNNING = 3;
  PROCESS_STATE_STOPPING = 4;
  PROCESS_STATE_FAILED = 5;
  // The agent couldn't find out. native_state says why.
  PROCESS_STATE_UNKNOWN = 6;
}

// One operation for the agent to carry out (decision N): only the action
// and IDs, never names, paths, commands or settings.
message Command {
  // The session's epoch. A command from another epoch is a protocol error.
  int64 epoch = 1;
  string operation_id = 2;
  string server_id = 3;
  CommandAction action = 4;
}

enum CommandAction {
  COMMAND_ACTION_UNSPECIFIED = 0;
  COMMAND_ACTION_START = 1;
  COMMAND_ACTION_STOP = 2;
  // STOP, then START, reported in two phases.
  COMMAND_ACTION_RESTART = 3;
  // Provision, fetch the pinned jar and write server.properties (6c-2),
  // reported in the phases FETCHING and CONFIGURING. The settings come
  // from GetInstallSpec, never from the command.
  COMMAND_ACTION_INSTALL = 4;
  // Write eula.txt for an explicit acceptance (6c-2).
  COMMAND_ACTION_ACCEPT_EULA = 5;
}

// Sent once during a restart, after the stop succeeded and before the
// start begins. An install sends FETCHING, then CONFIGURING; it is claimed
// in PROVISIONING, so that one is never sent.
message Progress {
  int64 epoch = 1;
  string operation_id = 2;
  OperationPhase phase = 3;
}

enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0;
  OPERATION_PHASE_STARTING = 1;
  OPERATION_PHASE_PROVISIONING = 2;
  OPERATION_PHASE_FETCHING = 3;
  OPERATION_PHASE_CONFIGURING = 4;
}

// How a command ended. Exactly one per command. Codes only: the
// controller turns them into its own fixed messages, so no text from the
// agent ever reaches the operation history.
message Result {
  int64 epoch = 1;
  string operation_id = 2;
  ResultOutcome outcome = 3;
  ResultCode code = 4;
}

enum ResultOutcome {
  RESULT_OUTCOME_UNSPECIFIED = 0;
  RESULT_OUTCOME_SUCCEEDED = 1;
  // Definitely failed: the helper said so, or it was never asked.
  RESULT_OUTCOME_FAILED = 2;
  // Nobody knows whether it ran. The operation becomes uncertain.
  RESULT_OUTCOME_UNKNOWN = 3;
}

enum ResultCode {
  // Only with SUCCEEDED.
  RESULT_CODE_UNSPECIFIED = 0;
  // The helper answered with one of these.
  RESULT_CODE_NOT_FOUND = 1;
  RESULT_CODE_PERMISSION_DENIED = 2;
  RESULT_CODE_INVALID_REQUEST = 3;
  RESULT_CODE_ACTION_FAILED = 4;
  // Nothing was written to the helper, so nothing ran.
  RESULT_CODE_HELPER_UNAVAILABLE = 5;
  // A write to the helper was attempted and no valid answer came back.
  // Only with UNKNOWN.
  RESULT_CODE_NO_ANSWER = 6;
  // The server isn't in this agent's inventory; the helper was never
  // asked (F14).
  RESULT_CODE_UNKNOWN_SERVER = 7;
  // The helper refused: an earlier action on this server, or a systemd
  // job for it, is still running (S3).
  RESULT_CODE_SERVER_BUSY = 8;
  // The controller couldn't provide the pinned jar (6c-2).
  RESULT_CODE_ARTIFACT_UNAVAILABLE = 9;
  // The jar's size or SHA-256 wasn't the pinned one; nothing was
  // installed from it.
  RESULT_CODE_ARTIFACT_MISMATCH = 10;
  // The controller didn't give an install spec, or gave one this agent
  // refuses; nothing was done.
  RESULT_CODE_SPEC_UNAVAILABLE = 11;
}
