#
# Append to /etc/postgresql/18/main/pg_ident.conf. Each line lets one Unix
# user connect as one database role. Replace trevor with the host
# administrator's login. The controller's own user only ever gets
# waystone_app.
#
# MAPNAME   SYSTEM-USERNAME      PG-USERNAME
waystone    trevor               waystone_owner
waystone    trevor               waystone_app
waystone    waystone-controller  waystone_app
