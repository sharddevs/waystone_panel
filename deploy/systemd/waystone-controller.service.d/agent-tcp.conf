# SPDX-License-Identifier: AGPL-3.0-only
# Hands the controller the TCP agent listener as well (stage 6a). Install
# as /etc/systemd/system/waystone-controller.service.d/agent-tcp.conf only
# together with waystone-controller-agent-tcp.socket. Sockets= adds to the
# unit's list.
[Unit]
Requires=waystone-controller-agent-tcp.socket
After=waystone-controller-agent-tcp.socket

[Service]
Sockets=waystone-controller-agent-tcp.socket
